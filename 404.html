<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Md. Shourov</title>
    <style>
        :root { --primary: #0f766e; --bg: #f7faf8; --text: #10201d; --muted: #58706a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Inter, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .content { max-width: 480px; }
        h1 { font-size: 6rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 8px; }
        h2 { font-size: 1.5rem; margin-bottom: 12px; }
        p { color: var(--muted); margin-bottom: 24px; }
        a {
            display: inline-flex;
            align-items: center;
            padding: 12px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
        }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="content">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a href="/portfolio/">Back to Home</a>
    </div>
</body>
</html>
